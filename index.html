<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>Brand Discovery Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Mono:wght@400;500&family=Archivo:wght@800&family=Playfair+Display:wght@700&family=Poppins:wght@600&family=Cormorant+Garamond:wght@300&family=Anton&family=Caveat:wght@600&family=IBM+Plex+Mono:wght@500&family=Nunito:wght@800&family=Bebas+Neue&family=Hanken+Grotesk:wght@400&display=swap">
<style>
/* Layout: warm editorial (Shoreline). Oat ground, bone panels, 1px ink rules, Albert Sans with DM Mono labels.
   Black-and-white photography carries the openers; retro-Italian print colour appears only in the Part 2 print band and This or That. */
:root{
  --bg:#EDE7DD; --surface:#FBF9F5; --ink:#1B1A17; --muted:#5E584D; --body2:#3D3A33; --line:#CFC5B5; --sand:#D6CCBD;
  --btn:#1B1A17; --btn-ink:#EDE7DD; --mark:#E8562A; --soft:#E3DACB; --ok:#2E6B47;
  --accent:var(--ink); --accent-ink:var(--bg); --accent-soft:var(--soft);
  --display:"Albert Sans", "Helvetica Neue", Arial, sans-serif;
  --body:"Albert Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171613; --surface:#211F1B; --ink:#EDE7DD; --muted:#A79F92; --body2:#CBC3B5; --line:#3B3831; --sand:#4A453C;
  --btn:#EDE7DD; --btn-ink:#171613; --mark:#F07A45; --soft:#2C2924; --ok:#7CC496; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171613; --surface:#211F1B; --ink:#EDE7DD; --muted:#A79F92; --body2:#CBC3B5; --line:#3B3831; --sand:#4A453C;
  --btn:#EDE7DD; --btn-ink:#171613; --mark:#F07A45; --soft:#2C2924; --ok:#7CC496; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:18px 12px;max-width:880px;margin:0 auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center}
.top-actions{display:flex;gap:12px;align-items:center}
.chip-btn{border:1px solid var(--ink);background:transparent;border-radius:0;padding:10px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.chip-btn:hover{background:var(--ink);color:var(--bg)}
.save{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:16px}
.rail{display:grid;grid-template-columns:9fr 5fr;gap:14px;margin-top:16px}
.rail-part{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.rail i{height:3px;background:var(--line)}
.rail i.on{background:var(--ink)}
.rail i.part{background:linear-gradient(90deg,var(--ink) var(--p),var(--line) var(--p))}
.rail i.cur{height:3px;box-shadow:0 3px 0 var(--mark)}

/* page */
main{max-width:880px;margin:0 auto;padding-block:40px 150px}
.kicker{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kicker::before{content:"("}.kicker::after{content:")"}
h1{font-family:var(--display);font-weight:500;font-size:clamp(36px,6.4vw,64px);line-height:1;margin:18px 0 16px;text-wrap:balance;letter-spacing:-.04em}
h1 em{font-style:normal;font-weight:300}
.help{color:var(--body2);max-width:60ch;margin:0 0 30px;font-size:18px}
.help.sm{margin:0 0 6px;font-size:16px}
.fields{display:grid;gap:18px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
label.f{display:grid;gap:8px;min-width:0}
label.f span,.flabel{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;font-size:19px;color:var(--ink);background:var(--surface);
  border:1px solid var(--sand);border-radius:0;padding:15px 16px;transition:border-color .15s}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:160px;resize:vertical;line-height:1.55}
textarea.small{min-height:110px}
textarea.big{min-height:260px;font-size:21px}
input.headline{font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:-.02em}
::placeholder{color:var(--muted);opacity:.6}

.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{border:1px solid var(--ink);background:transparent;border-radius:0;padding:12px 18px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.choice[aria-pressed=true]{background:var(--btn);color:var(--btn-ink)}

.combo{display:grid;gap:18px}
.subq{margin-top:18px;border-top:1px solid var(--ink);padding-top:22px}
h2.sub{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.8vw,32px);line-height:1.1;margin:14px 0 4px;text-wrap:balance;letter-spacing:-.03em}
.subq h2.sub{margin-top:0}
.or{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:10px 0}
.or span::before{content:"( "}.or span::after{content:" )"}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.sentence{font-family:var(--display);font-weight:500;font-size:clamp(26px,4.6vw,40px);line-height:1.7;letter-spacing:-.03em}
.sentence input{display:inline-block;width:auto;min-width:6ch;max-width:100%;font-family:var(--display);font-weight:400;font-size:inherit;letter-spacing:-.02em;
  padding:0 6px;border:none;border-bottom:1px solid var(--ink);background:transparent;vertical-align:baseline}
.sentence input:focus{background:var(--surface)}

.likes{display:grid;gap:12px}
.like{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:12px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.like input{font-family:var(--body);font-size:18px;letter-spacing:0;text-transform:none}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:4px 8px}
.x:hover{color:var(--ink)}
@media (max-width:560px){.like{grid-template-columns:auto 1fr auto}.like .bf{grid-column:1}.like input:nth-of-type(2){grid-column:2}}
.add{justify-self:start;border:1px solid var(--ink);background:none;border-radius:0;padding:10px 16px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.add:hover{background:var(--ink);color:var(--bg)}

/* archetype cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px}
@media (max-width:420px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;text-align:left;border:none;background:none;padding:0;cursor:pointer;display:grid;gap:10px;align-content:start;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card-art{aspect-ratio:120/170;max-width:100%;overflow:hidden}
.card-art svg{width:100%;height:100%;display:block}
.card small{color:var(--body2);font-size:14px;line-height:1.4;padding:0 2px}
.card.lead .card-art{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--mark)}
.card.support .card-art{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink)}
.card .tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px}
.card.lead .tag{background:var(--mark);color:#1B1A17}
.card.support .tag{background:var(--bg);color:var(--ink)}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.legend b{color:var(--ink);font-weight:500}

.sliders{display:grid;gap:32px}
.sl-labels{display:flex;justify-content:space-between;font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}

/* This or That */
.tot-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tot-meta b{color:var(--ink);font-weight:500}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.pair{gap:10px}}
.opt{border:none;padding:0;background:none;cursor:pointer;display:grid;gap:10px;text-align:left;transition:transform .2s}
.opt .art{aspect-ratio:4/3;max-width:100%;overflow:hidden;display:grid;place-items:center;background:#fff}
.opt .art svg{width:100%;height:100%;display:block}
.opt span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.opt:hover{transform:translateY(-3px)}
.opt.picked .art{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink)}
.opt.faded{opacity:.35}
.kbd{font-size:14px;color:var(--muted);margin-top:16px}
.profile{display:grid}
.prow{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:start;border-top:1px solid var(--ink);padding-block:14px}
@media (max-width:520px){.prow{grid-template-columns:1fr}}
.prow h4{margin:0;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag2{border:1px solid var(--ink);padding:5px 12px;font-size:15px}
.tag2.neutral{border-color:var(--line);color:var(--muted)}

.words3{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:560px){.words3{grid-template-columns:1fr}}
.words3 h3{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.03em;margin:0 0 10px}
.words3 .never input{text-decoration:line-through;text-decoration-color:var(--mark);text-decoration-thickness:2px}
.words3 .col{display:grid;gap:10px}

/* footer nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(180deg,transparent,var(--bg) 32%);
  padding:30px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:880px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{border:none;background:none;color:var(--ink);cursor:pointer;padding:12px 0;white-space:nowrap;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid transparent}
.back:hover{border-bottom-color:var(--ink)}
.next{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:0;padding:16px 24px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:opacity .15s}
.next:hover{opacity:.85}
.next:disabled{opacity:.35;cursor:not-allowed}
.next.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.hint{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
@media (max-width:520px){.hint{display:none}}

/* openers: split hero with photograph, and the print band */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:0;background:var(--surface);margin-bottom:34px;min-height:520px}
.split .txt{padding:clamp(24px,4.5vw,52px);display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-width:0}
.split h1{font-size:clamp(36px,5.2vw,58px);line-height:1;margin:18px 0 0;letter-spacing:-.045em}
.split figure{margin:0;position:relative;min-height:320px}
.split figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.split figcaption{position:absolute;left:18px;bottom:16px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff}
@media (max-width:640px){.split{grid-template-columns:1fr}.split figure{min-height:240px;order:-1}}
.printband{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:6px 0 30px}
.printband svg{width:100%;height:auto;aspect-ratio:3/4;display:block}
@media (max-width:560px){.printband{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lede{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,24px);line-height:1.35;margin:0 0 22px;max-width:34ch;color:var(--body2);letter-spacing:-.01em}
.prose{max-width:62ch;display:grid;gap:14px;margin-bottom:24px;color:var(--body2)}
.prose p{margin:0}
.stages{list-style:none;padding:0;margin:10px 0 0;display:grid;counter-reset:st;border-top:1px solid var(--ink)}
.stages li{counter-increment:st;position:relative;display:grid;gap:4px;border-bottom:1px solid var(--ink);padding:20px 0 20px 72px}
.stages li::before{content:counter(st, decimal-leading-zero);position:absolute;left:0;top:24px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.stages b{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.03em}
.stages span{color:var(--body2);font-size:16px}
.stages em{position:absolute;right:0;top:24px;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--btn);color:var(--btn-ink);padding:4px 10px}
@media (max-width:520px){.stages em{position:static;justify-self:start}}
.optional{display:inline-block;border:1px solid currentColor;padding:1px 7px;font-size:10px;letter-spacing:.12em}
.note{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:16px 0;font-size:16px;max-width:62ch}
.resume{display:grid;margin-top:28px;border-top:1px solid var(--ink)}
.resume .hint{padding:12px 0;text-transform:uppercase;letter-spacing:.12em}
.resume button{display:flex;justify-content:space-between;gap:12px;text-align:left;border:none;border-bottom:1px solid var(--ink);background:none;padding:16px 0;cursor:pointer}
.resume button:hover{background:var(--surface)}
.resume small{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

/* moodboard */
.drop{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px dashed var(--ink);padding:22px;background:var(--surface)}
.drop.over{background:var(--soft)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.thumbs.sm{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));margin-bottom:6px}
.thumbs figure{margin:0;position:relative;aspect-ratio:1;max-width:100%;overflow:hidden;background:var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:0;right:0;background:var(--ink);color:var(--bg);width:28px;height:28px;padding:0;font-size:18px}

/* review */
.rv{display:grid;gap:28px}
.rv section{border-top:1px solid var(--ink);padding-top:16px}
.rv h3{font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:-.03em;margin:0 0 12px}
.rv dl{margin:0;display:grid;grid-template-columns:220px 1fr;gap:10px 18px}
@media (max-width:560px){.rv dl{grid-template-columns:1fr}.rv dd{margin-bottom:8px}}
.rv dt{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:4px}
.rv dd{margin:0;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.edit{border:none;background:none;color:var(--ink);cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted);font-style:italic}

/* results */
.res-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.res-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:10px 12px;border-radius:0;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor}
.pill.done{color:var(--ok)}
.pill.prog{color:var(--muted)}
.cmp{display:grid;gap:38px;margin-top:38px}
.cmp h2{font-family:var(--display);font-weight:500;font-size:34px;margin:0 0 4px;letter-spacing:-.035em}
.part-h{justify-self:start;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-top:1px solid var(--ink);padding-top:12px;margin-top:10px;width:100%}
.qblock{display:grid;gap:6px;margin-top:16px}
.qblock h4{margin:0;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ans{display:grid;grid-template-columns:150px 1fr;gap:12px;background:var(--surface);padding:12px 16px}
@media (max-width:560px){.ans{grid-template-columns:1fr;gap:2px}}
.ans b{font-weight:600}
.ans div{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.slcmp{background:var(--surface);padding:16px 18px;display:grid;gap:18px}
.slc-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.slc-track{position:relative;height:26px;border-top:1px solid var(--ink);margin-top:12px}
.slc-dot{position:absolute;top:-12px;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;border:2px solid var(--surface)}
.totcmp td.diff{background:var(--soft)}
.legend-p{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.legend-p span{display:flex;align-items:center;gap:6px}
.legend-p i{width:12px;height:12px;border-radius:50%;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;z-index:20}
textarea.copyout{min-height:220px;font-size:14px;font-family:var(--mono)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* questions use two sizes only */
:root{--q1:clamp(30px,4.8vw,48px);--q2:clamp(22px,3.2vw,28px)}
main h1{font-size:var(--q1)}
h2.sub,.sentence,.sl-labels,.words3 h3,input.headline{font-size:var(--q2)!important}
.help,.help.sm{font-size:17px}
.or+.subq{border-top:none;padding-top:0;margin-top:0}
.combo>.subq:first-child{border-top:none;padding-top:0;margin-top:6px}
h1 i,h2 i{font-style:italic;font-weight:400}
.opt .art img{width:100%;height:100%;object-fit:cover;display:block}
/* stickers */
.sticker{float:right;width:96px;height:96px;margin:-8px 0 14px 22px;transform:rotate(var(--r));filter:drop-shadow(0 8px 10px rgba(27,26,23,.14));animation:sway 7s ease-in-out infinite;shape-outside:circle(50%)}
.sticker svg{width:100%;height:100%;display:block}
.sticker.abs{float:none;position:absolute;top:22px;right:22px;margin:0}

.chase{position:relative;width:400px;height:255px;margin:30px auto 0;clear:both}
.chase .track{position:absolute;left:0;top:0;width:400px;height:250px;overflow:visible}
.runner{position:absolute;left:0;top:0;width:76px;height:95px;offset-path:path("M50 140 A150 72 0 1 1 350 140 A150 72 0 1 1 50 140");offset-rotate:0deg;offset-anchor:50% 97%;animation:run 7.2s linear infinite}
.runner.foe{animation-delay:-3.6s}

.runner svg{width:100%;height:100%;display:block;overflow:visible}
@media (max-width:460px){.chase{zoom:.82}}
@keyframes run{0%{offset-distance:0%;scale:1;z-index:2}25%{scale:.82}49.9%{z-index:2}50%{scale:1;z-index:4}75%{scale:1.14}100%{offset-distance:100%;scale:1;z-index:4}}

.runner .legs path{transform-box:fill-box;transform-origin:50% 0;animation:leg .28s ease-in-out infinite alternate}
.runner .legs .l2{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.runner .bob{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px)}}

.runner .puffs .pf2{animation-delay:-.28s}

@media (prefers-reduced-motion: reduce){.runner.foe{offset-distance:50%}}
.runner .leg,.runner .arm{transform-box:view-box;animation:leg .3s ease-in-out infinite alternate}
.runner .l2,.runner .a1{animation-direction:alternate-reverse}
.runner .sword{transform-box:view-box;transform-origin:32px 27px;animation:sword .6s ease-in-out infinite alternate}

 {id:"together",type:"static",html:()=>`<div class="kicker">What we'll do together</div><h1>Talk, write a lot, and <em>iterate</em>.</h1>
   <div class="prose"><p>This process is a dialogue that helps you see and express the brilliant work you're already doing. The result? It makes it more effortless and exciting to get on with your next stage of growth.</p>
   <p>There are three stages, which we'll tailor to what you need. Not puffery and process, just steps to get you to your next steps. It takes some time, effort and the inclusion of key people around your business: your team, customers and leadership. Your business and brand's past and future are shaped by all of them. And it's more fun to do things together.</p></div>
   <ol class="stages"><li><b>Explore</b><span>Drawing out what's in your head, heart and sometimes hands. Your direction, your principles and what that literally looks and feels like. Exercises to express it, then good conversations about how that might chime or differ with your team.</span><em>You are here</em></li>
   <li><b>Distill</b><span>Refine your brand description so it helps you make decisions, inspire others and change how you use your brand where needed. I'll make a start and you can rip it up, change it and refine it until it absolutely feels like you. We'll distill it down to a useful one-pager.</span></li>
   <li><b>Deliver</b><span>A top-line plan for the what, how, who and when of your next stage of brand growth. We'll review your existing plans for what aligns with and amplifies where you want to go, and refine them to a list of 10 next actions.</span></li></ol>`},
 {id:"explore",type:"static",html:()=>`<div class="kicker">Stage 1 · Explore</div><h1>Explore exercises</h1>
   <div class="prose"><p>So this is a bit of fun. And can sometimes be hard. But that's precisely the point. It forces you and your team to put into words things that are often sensed but rarely articulated. Also, often it forces you to think about choices in an unknowable future. But one thing you do know? Your business. Your team. Your customers. And that's all you need.</p>
   <p>Don't overthink it - just get it down and we'll refine along the way.<br>If you don't have an answer, that's OK, we can come back to it together later.</p>
   <p>This will be used to create a snapshot of your brand, your customers and market position in a simple format that will be a touchstone for you and those you work with.</p></div>
   <p class="note"><b>Each key person to shaping the brand (usually founders) does this solo.</b> Then we share and discuss.</p>

/* What each page records, as [label, text] pairs (fixed shape: drives review, compare, copy and CSV) */
function outOf(p,a){
  const j=arr=>(arr||[]).filter(has);
  switch(p.type){
    case "combo": return p.blocks.flatMap(b=>outOf(b,a));
    case "area": case "text": return [[p.label,a[p.k]]];
    case "beforeafter": return [["Before us, they feel",a.q4_before],["After us, they feel",a.q4_after]];
    case "sentence": { const ks=p.parts.filter(Array.isArray).map(x=>x[0]); return [[p.label, ks.some(k=>has(a[k]))?p.parts.map(x=>Array.isArray(x)?(a[x[0]]||"___"):x).join(""):""]]; }
    case "likes": return [[p.label,(a[p.k]||[]).filter(x=>x&&(has(x.x)||has(x.y))).map(x=>`${x.x||"___"}, but for ${x.y||"___"}`).join("\n")]];
    case "list": return [[p.label, j(a[p.k]).join(p.row?", ":"\n")]];
    case "cards": return [["Archetype",[a.a_lead&&("Lead: "+a.a_lead),a.a_support&&("Support: "+a.a_support)].filter(Boolean).join(" · ")]];
    case "sliders": return [["Dials",a.sl?SLIDERS.map(([k,l,r])=>`${l} ${a.sl[k]??50} / ${100-(a.sl[k]??50)} ${r}`).join("\n"):""],["Dials, in their own words",a.sl_note]];
    case "tot": return ROUNDS.map((r,ri)=>[r, PAIRS.filter(x=>x.r===ri).map(x=>a.tot&&a.tot[x.id]?labelOf(x,a.tot[x.id]):null).filter(Boolean).join(", ")]);
    case "moodboard": return [["Moodboard images",(a.mb_images||[]).length?`${a.mb_images.length} image${a.mb_images.length>1?"s":""}`:""],["Moodboard links and notes",a.mb_notes]];
    case "words3": return [[p.label[0],j(a.v_use).join(", ")],[p.label[1],j(a.v_never).join(", ")]];
  } return [];
}
function fmt(a){ return SECTIONS.map((sec,i)=>({s:i+1,items:QPAGES.filter(p=>p.s===i+1).flatMap(p=>outOf(p,a).map(([l,v])=>[l,p.id,v]))})); }
function pageHas(p,a){ if(p.type==="tot") return a.tot && Object.keys(a.tot).length>=PAIRS.length; if(p.type==="moodboard") return has(a.mb_notes)||(a.mb_images||[]).length>0; return outOf(p,a).some(([,v])=>has(v)); }
function progressOf(run){const a=run.answers||{};return QPAGES.filter(p=>!p.opt&&pageHas(p,a)).length}
const REQ_COUNT = QPAGES.filter(p=>!p.opt).length;
function asText(run){
  let out=`BRAND DISCOVERY JOURNEY\n${run.name||""} · ${run.role||""} · ${run.business||""}\n${run.mode==="team"?"Answered as a team":"Answered individually"}\n`;
  let part=0;
  fmt(run.answers||{}).forEach(g=>{const sec=SECTIONS[g.s-1]; if(sec.p!==part){part=sec.p;out+=`\n=== PART ${part}. ${PART_NAMES[part].toUpperCase()} ===\n`}
    out+=`\n${sec.n.toUpperCase()}\n`; g.items.forEach(([q,,v])=>{out+=`${q}: ${has(v)?v:"—"}\n`})});
  (run.answers.mb_images||[]).forEach((im,i)=>{out+=`Moodboard image ${i+1}: ${im.name||""}\n`});
  return out;
}

  SLIDERS.forEach(([k,l,r])=>cols.push(`Dial: ${l} (0) to ${r} (100)`));
  PAIRS.forEach(p=>cols.push(`This or That: ${optsOf(p).map(o=>o[0]).join(" / ")}`));
  return cols;
}
function sheetRow(r){
  const a=r.answers||{};
  const row=[r.id,r.startedAt||"",r.updatedAt||"",r.completedAt?"Completed":`In progress (${progressOf(r)}/${REQ_COUNT})`,r.name,r.business,r.role,r.mode==="team"?"Team":"Solo"];
  fmt(a).forEach(g=>g.items.forEach(([,,v])=>row.push(v||"")));
  row.push((a.mb_images||[]).map(im=>im.url).join(" "));
  SLIDERS.forEach(([k])=>row.push(a.sl&&a.sl[k]!=null?100-a.sl[k]:""));
  PAIRS.forEach(p=>row.push(a.tot&&a.tot[p.id]?labelOf(p,a.tot[p.id]):""));
  return row.map(v=>String(v??""));
}
let sheetSaving=false, sheetQueued=false;
async function saveToSheet(){
  if(!run||!SHEET_URL) return;
  if(!has(run.name)&&!has(run.business)) return;
  if(sheetSaving){sheetQueued=true;return}
  sheetSaving=true; setStatus("Saving…");
  const body=JSON.stringify({id:run.id,headers:sheetColumns(),row:sheetRow(run)});
  try{ await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); setStatus("Saved"); }
  catch(e){ setStatus("Saved on this device"); }
  sheetSaving=false; if(sheetQueued){sheetQueued=false;saveToSheet()}
}
async function saveRemote(){
  if(SHEET_URL){ return saveToSheet(); }
  if(!run||!db||!me||online===false) return;
  if(saving){queued=true;return}
  saving=true; setStatus("Saving…");
  myDoc.runs[run.id]=JSON.parse(JSON.stringify(run));
  try{ await db.doc("responses/"+me).set(myDoc); online=true; setStatus("Saved"); }
  catch(e){
    if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{await db.doc("responses/"+me).set(myDoc);setStatus("Saved")}catch(e2){setStatus("Saved on this device")} }
    else { online=false; setStatus("Saved on this device"); }
  }
  saving=false; if(queued){queued=false;saveRemote()}
}

function render(){
  const p=PAGES[page]; window.scrollTo(0,0);
  if(p.type==="tot"&&lastPage!==page){const t=(run.answers.tot||{});const f=PAIRS.findIndex(x=>!t[x.id]);totI=f<0?PAIRS.length:f;}
  lastPage=page;
  $("#nav").hidden = ["welcome","done","results"].includes(p.type);
  const a = run?run.answers:{};
  let h="";
  switch(p.type){
   case "welcome": h=welcomeHTML(); break;
   case "static": h=p.html(); break;
   case "about": h=head(p)+`<div class="fields">${lab("name","Your name","Sam")}${lab("business","Business name","")}${lab("role","Your role","Co-founder")}
     <div class="f" style="display:grid;gap:8px"><span class="flabel">How are you answering?</span><div class="choices">
     <button class="choice" data-mode="solo" aria-pressed="${run.mode!=="team"}">Just me</button><button class="choice" data-mode="team" aria-pressed="${run.mode==="team"}">Our team, together</button></div></div></div>`; break;
   case "area": case "text": case "beforeafter": case "sentence": case "likes": case "list": h=head(p)+blockHTML(p,a); break;
   case "combo": h=head(p)+`<div class="combo">${p.blocks.map(b=>blockHTML(b,a)).join("")}</div>`; break;
   case "cards": h=head(p)+`<div class="legend"><span>Lead: <b>${esc(a.a_lead||"—")}</b></span><span>Support: <b>${esc(a.a_support||"—")}</b></span></div><div class="cards">${ARCH.map(([n,d],i)=>{const c=a.a_lead===n?"lead":a.a_support===n?"support":"";return `<button class="card ${c}" data-arch="${n}" aria-pressed="${!!c}" aria-label="${n}: ${d}">${c?`<span class="tag">${c}</span>`:""}<div class="card-art">${archCard(n,i)}</div><small>${d}</small></button>`}).join("")}</div>`; break;
   case "sliders": h=head(p)+`<div class="sliders">${SLIDERS.map(([k,l,r])=>`<div><div class="sl-labels"><span>${l}</span><span>${r}</span></div><input type="range" min="0" max="100" step="1" id="sl_${k}" data-sl="${k}" value="${100-((a.sl&&a.sl[k]!=null)?a.sl[k]:50)}" aria-label="${l} to ${r}"></div>`).join("")}</div><div class="subq" style="margin-top:34px"><h2 class="sub">Not quite capturing it? Tell us in your own words</h2></div><textarea id="f_sl_note" data-k="sl_note" class="small"></textarea>`; break;
   case "tot": h=totHTML(p); break;
   case "moodboard": h=head(p)+moodHTML(a); break;
   case "words3": h=head(p)+`<div class="words3"><div class="col"><h3>We'd say</h3>${[0,1,2].map(i=>inp(`v_use.${i}`,i===0?"honest":"")).join("")}</div><div class="col never"><h3>We'd never say</h3>${[0,1,2].map(i=>inp(`v_never.${i}`,i===0?"synergy":"")).join("")}</div></div>`; break;
   case "review": h=reviewHTML(); break;
   case "done": h=doneHTML(); break;
   case "results": h=`<div id="results"><p class="help">Loading responses…</p></div>`; break;
  }
  if(p.after) h+=p.after();
  const stk = (["results","welcome","part1"].includes(p.type)||["welcome","part1","whimsy"].includes(p.id)) ? "" : sticker(p.id);
  main.innerHTML=`<div class="fade">${stk}${h}</div>`;
  bind(p); rail(); navState();
  if(p.type==="results") startResults();
}

function bind(p){
  const a = run?run.answers:{};
  main.querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k; const target = p.type==="about" ? run : a;
    const v=getP(target,k); if(v!=null) el.value=v; else if(p.ph==="Welcome to "&&el.tagName==="TEXTAREA"&&run.business) el.placeholder=`Welcome to ${run.business}…`;
    el.addEventListener("input",()=>{ setP(target,k,el.value); if(el.closest(".sentence")) el.size=Math.max(6,(el.value||el.placeholder).length+1); dirty(); navState(); });
    if(el.tagName==="INPUT") el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); const all=[...main.querySelectorAll("input[type=text],textarea")]; const nx=all[all.indexOf(el)+1]; if(p.type==="combo"&&nx) nx.focus(); else go(1)}});
  });
  main.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{run.mode=b.dataset.mode;dirty();main.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  main.querySelectorAll("[data-arch]").forEach(b=>b.onclick=()=>{
    const n=b.dataset.arch;
    if(a.a_lead===n){a.a_lead=a.a_support||"";a.a_support=""}
    else if(a.a_support===n){a.a_support=""}
    else if(!a.a_lead){a.a_lead=n}
    else {a.a_support=n}
    dirty(); const y=window.scrollY; render(); window.scrollTo(0,y); const nb=main.querySelector(`[data-arch="${n}"]`); if(nb) nb.focus({preventScroll:true});
  });
  main.querySelectorAll("[data-sl]").forEach(el=>el.addEventListener("input",()=>{a.sl=a.sl||{};SLIDERS.forEach(([k])=>{if(a.sl[k]==null)a.sl[k]=50});a.sl[el.dataset.sl]=100-Number(el.value);dirty();navState()}));
  main.querySelectorAll("[data-addlike]").forEach(add=>add.onclick=()=>{const k=add.dataset.addlike;a[k].push({x:"",y:""});const y=window.scrollY;render();window.scrollTo(0,y);const ins=main.querySelectorAll(".like input");ins[ins.length-2]&&ins[ins.length-2].focus()});
  main.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const k=b.dataset.lk;a[k].splice(Number(b.dataset.del),1);if(!a[k].length)a[k].push({x:"",y:""});dirty();const y=window.scrollY;render();window.scrollTo(0,y)});
  main.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{page=pageIdx(b.dataset.edit);run.page=page;render()});
  if(p.type==="welcome") bindWelcome();
  if(p.type==="tot") bindTot();
  if(p.type==="moodboard") bindMood();
  if(p.type==="review"){ $("#submit").onclick=()=>{run.completedAt=new Date().toISOString();dirty();saveRemote();page=pageIdx("done");render()} }
  if(p.type==="done") bindDone();
  const first=main.querySelector("input[type=text],textarea"); if(first&&!["review","done","moodboard"].includes(p.type)&&!matchMedia("(hover: none)").matches) first.focus({preventScroll:true});
}

function navState(){
  const p=PAGES[page]; const n=$("#next"); const hint=$("#hint");
  $("#back").style.visibility = page<=1 ? "hidden":"visible";
  const empty = p.s && !pageHas(p,run.answers);
  n.textContent = (PAGES[page+1]&&PAGES[page+1].type==="review") ? "Review answers" : (empty ? "Skip for now" : "Continue");
  n.classList.toggle("ghost", !!empty);
  n.disabled = !!(p.req && p.req.some(k=>!has(run[k])));
  n.hidden = p.type==="review";
  hint.textContent = (p.type==="text"||p.type==="sentence") ? "Press Enter ↵" : "";
}
function go(d){
  const p=PAGES[page]; if(d>0&&p.req&&p.req.some(k=>!has(run[k]))) return;
  page=Math.max(1,Math.min(pageIdx("done"),page+d)); run.page=page; dirty(); if(d>0) saveRemote(); render();
}
$("#next").onclick=()=>go(1); $("#back").onclick=()=>go(-1);

/* welcome */

  const runs=allMyRuns();
  return `<div class="hero"><div class="split"><div class="txt">${sticker("welcome",true)}<div><div class="kicker">Brand discovery</div><h1>Hi there. This is all about <em>you</em>. Your brand.</h1></div>
  <p class="lede" style="margin:0">You've done so much work to get here. Now let's take the next step.</p></div><figure><img src="img/sea.jpg" alt="Calm sea meeting a pale horizon"><figcaption>N° 01 — The shore</figcaption></figure></div>

  <div style="display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap"><button class="next" id="start">${runs.length?"Start a new journey":"Let's begin"}</button></div>
  ${runs.length?`<div class="resume"><span class="hint">Or carry on where you left off</span>${runs.slice(0,6).map(r=>`<button data-resume="${esc(r.id)}"><span><b>${esc(r.business||"Untitled")}</b> · ${esc(r.name||"")}</span><small>${r.completedAt?"Completed":progressOf(r)+" of "+REQ_COUNT+" answered"}</small></button>`).join("")}</div>`:""}</div>`;
}
function bindWelcome(){

/* This or That */
let totI=0, keyH=null;
function totHTML(p){
  const t=run.answers.tot||{};
  const sec=SECTIONS[p.s-1];
  const kick=`<div class="kicker">Part ${sec.p} · ${secNo(p.s)} of ${secCount(2)} · This or That</div>`;
  if(totI>=PAIRS.length) return kick+`<h1>Your visual direction.</h1><p class="help">Here's where your gut took you.</p>`+profileHTML(t)+`<div style="margin-top:22px"><button class="add" id="replay">Play again</button></div>`;
  const pr=PAIRS[totI]; const pick=t[pr.id];
  const intro = totI===0 && !Object.keys(t).length;
  return `${kick}<h1>${intro?"Go with your gut.":(optsOf(pr).length>2?"Which season feels most like you?":"This, or that?")}</h1>${intro?`<p class="help">${PAIRS.length} quick choices across colour, type, imagery, shape, season and overall vibe. Each pair is a pair of opposites, so there's no wrong answer.</p>`:""}
   <div class="tot-meta"><span>Round ${pr.r+1} of ${ROUNDS.length} · <b>${ROUNDS[pr.r]}</b></span><span>${totI+1} / ${PAIRS.length}</span></div>
   <div class="pair${optsOf(pr).length>2?" four":""}">${optsOf(pr).map((o,i)=>{const s=LET[i];return `<button class="opt ${pick===s?"picked":pick?"faded":""}" data-pick="${s}"><div class="art">${o[1]}</div><span>${esc(o[0])}</span></button>`}).join("")}</div>
   <div class="kbd">${optsOf(pr).length>2?"Pick one, or use the 1–4 keys":"Tap one, swipe, or use the ← and → keys"}${totI>0?` · <button class="edit" id="prevPair">Previous pair</button>`:""}</div>`;
}
function profileHTML(t){
  return `<div class="profile">${ROUNDS.map((r,ri)=>`<div class="prow"><h4>${r}</h4><div class="tags">${PAIRS.filter(p=>p.r===ri).map(p=>t[p.id]?`<span class="tag2">${esc(labelOf(p,t[p.id]))}</span>`:`<span class="tag2 neutral">—</span>`).join("")}</div></div>`).join("")}</div>`;
}
function bindTot(){
  const t=run.answers.tot=run.answers.tot||{};
  if(keyH) document.removeEventListener("keydown",keyH);
  const pick=s=>{ if(totI>=PAIRS.length) return; t[PAIRS[totI].id]=s; dirty(); main.querySelectorAll("[data-pick]").forEach(b=>{b.classList.toggle("picked",b.dataset.pick===s);b.classList.toggle("faded",b.dataset.pick!==s)});
    setTimeout(()=>{totI++; if(totI>=PAIRS.length) saveRemote(); render()},260); };
  main.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>pick(b.dataset.pick));
  const pv=$("#prevPair"); if(pv) pv.onclick=()=>{totI=Math.max(0,totI-1);render()};
  const rp=$("#replay"); if(rp) rp.onclick=()=>{totI=0;render()};
  keyH=e=>{ if(PAGES[page].type!=="tot"||totI>=PAIRS.length) return; const n=optsOf(PAIRS[totI]).length; if(n===2&&e.key==="ArrowLeft"){e.preventDefault();pick("a")} if(n===2&&e.key==="ArrowRight"){e.preventDefault();pick("b")} if(/^[1-4]$/.test(e.key)&&Number(e.key)<=n){e.preventDefault();pick(LET[Number(e.key)-1])} };
  document.addEventListener("keydown",keyH);
  const pair=main.querySelector(".pair"); if(pair){let x0=null;pair.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});pair.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60&&optsOf(PAIRS[totI]).length===2)pick(dx<0?"a":"b");x0=null})}
}

/* Moodboard */
function moodHTML(a){
  const ims=a.mb_images||[];
  return `<div class="fields">${assets?`<div class="drop" id="drop"><input type="file" id="mbFile" accept="image/*" multiple hidden><button class="add" id="mbPick">+ Add images</button><span class="hint">Drop images here, or choose them from your device. Up to 12.</span></div>`:""}
   ${ims.length?`<div class="thumbs">${ims.map((im,i)=>`<figure><img src="${esc(im.url)}" alt="${esc(im.name||"Moodboard image")}" loading="lazy"><button class="x" data-rm="${i}" aria-label="Remove image">×</button></figure>`).join("")}</div>`:""}
   <label class="f"><span>${assets?"Links and notes":"Links to your moodboard, and notes"}</span><textarea id="f_mb_notes" data-k="mb_notes" class="small" placeholder="A Pinterest board, a Canva link, or the colours, places and feelings you'd pin up…"></textarea></label></div>`;
}
function bindMood(){
  const a=run.answers; const f=$("#mbFile"); if(!f) return;
  $("#mbPick").onclick=()=>f.click();
  const up=async files=>{
    a.mb_images=a.mb_images||[];
    const list=[...files].filter(x=>x.type.startsWith("image/")).slice(0,Math.max(0,12-a.mb_images.length));
    if(!list.length){toast("Add image files, up to 12 in total");return}
    setStatus("Uploading…");
    for(const file of list){ try{ const r=await assets.upload(file); a.mb_images.push({id:r.id,url:r.url,name:file.name}); }
      catch(e){ toast(e&&e.code==="too_large"?`${file.name} is too large`:`Couldn't add ${file.name}`) } }
    dirty(); saveRemote(); render();
  };
  f.onchange=()=>up(f.files);
  const d=$("#drop"); d.addEventListener("dragover",e=>{e.preventDefault();d.classList.add("over")}); d.addEventListener("dragleave",()=>d.classList.remove("over"));
  d.addEventListener("drop",e=>{e.preventDefault();d.classList.remove("over");up(e.dataTransfer.files)});
  main.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{a.mb_images.splice(Number(b.dataset.rm),1);dirty();render()});
}

function reviewHTML(){

  <div style="margin-top:30px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="next" id="submit">${run.completedAt?"Save changes":"Submit my answers"}</button><button class="back" data-edit="e5">← Back</button></div>`;

function doneHTML(){
  const off = online!==true;
  return `<div class="hero"><div class="kicker">Explore · done</div><h1>Thank you, ${esc((run.name||"").split(" ")[0])}.</h1>
  <p class="help">${off?"Your answers are saved in this browser. Copy them below and send them back so they can go into your brand snapshot.":"Your answers are in. Next we'll share and discuss them together, then distill them into your one-page brand snapshot."}</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="next" id="copyMine">Copy my answers</button><button class="chip-btn" id="dlMine">Download as text</button><button class="chip-btn" id="home">Back to start</button></div>
  <textarea class="copyout" id="copyArea" readonly style="margin-top:18px" ${off?"":"hidden"}>${esc(asText(run))}</textarea></div>`;

async function copyText(s,area){ try{await navigator.clipboard.writeText(s);toast("Copied")}catch(e){ if(area){area.hidden=false;area.focus();area.select();toast("Select all and copy")} } }
async function saveFile(name,data){
  const c=C(); const d=c?await c.use("downloads"):null;
  if(!d){ try{ const url=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); }catch(e){ toast("Couldn't save the file") } return }
  try{const r=await d.save({filename:name,data}); if(r&&r.status==="saved")toast("Saved")}catch(e){ if(e&&e.code!=="cancelled"&&e.code!=="declined") toast("Couldn't save the file") }
}
const slug=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function bindDone(){
  $("#copyMine").onclick=()=>copyText(asText(run),$("#copyArea"));
  $("#dlMine").onclick=()=>saveFile(`brand-journey-${slug(run.business)||"answers"}-${slug(run.name)}.txt`,asText(run));
  $("#home").onclick=()=>{page=0;render()};
}

/* ---------- results (owner only) ---------- */
let resUnsub=null, allRuns=[], resBiz="__all";
const COLORS=["#1B1A17","#E0561A","#1F5BA8","#2E6B47","#B0487A","#8A6A1C","#0E7C86","#6B6458"];
function startResults(){
  if(!db){$("#results").innerHTML=`<p class="help">Responses can't load in this view.</p>`;return}
  if(resUnsub){drawResults();return}
  resUnsub=db.collection("responses").onSnapshot(snap=>{
    allRuns=[]; snap.docs.forEach(d=>{const runs=(d.data()||{}).runs||{};Object.values(runs).forEach(r=>allRuns.push({...r,answers:r.answers||{}}))});
    allRuns.sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
    if(PAGES[page].type==="results") drawResults();
  },e=>{const el=$("#results"); if(el) el.innerHTML=`<p class="help">Responses couldn't load (${esc(e.code)}).</p>`});
}
const bizKey=s=>String(s||"Untitled").trim().toLowerCase();
function drawResults(){
  const el=$("#results"); if(!el) return;
  const bizs=[...new Map(allRuns.map(r=>[bizKey(r.business),r.business||"Untitled"])).entries()];
  if(resBiz!=="__all"&&!bizs.some(([k])=>k===resBiz)) resBiz="__all";
  const rows=allRuns.filter(r=>resBiz==="__all"||bizKey(r.business)===resBiz);
  const people=rows.map((r,i)=>({r,c:COLORS[i%COLORS.length],ini:(r.name||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase()}));
  el.innerHTML=`<div class="res-head"><div><div class="kicker">Wallflower worksheet</div><h1 style="margin-bottom:0">Responses</h1></div>
   <div class="res-tools"><select id="bizSel" aria-label="Business"><option value="__all">All businesses (${allRuns.length})</option>${bizs.map(([k,n])=>`<option value="${esc(k)}" ${k===resBiz?"selected":""}>${esc(n)} (${allRuns.filter(r=>bizKey(r.business)===k).length})</option>`).join("")}</select>
   <button class="chip-btn" id="csv">Download CSV</button><button class="chip-btn" id="tsv">Copy for Sheets</button></div></div>
   ${!rows.length?`<p class="note">No responses yet. Share this page with your client's founders and each person's answers appear here as they go.</p>`:`
   <div class="tbl-wrap"><table><thead><tr><th>Person</th><th>Business</th><th>Role</th><th>Mode</th><th>Progress</th><th>Last update</th></tr></thead><tbody>
   ${people.map(({r,c})=>`<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:50%;background:${c};display:inline-block"></i>${esc(r.name||"—")}</span></td><td>${esc(r.business||"—")}</td><td>${esc(r.role||"—")}</td><td>${r.mode==="team"?"Team":"Solo"}</td><td>${r.completedAt?`<span class="pill done">Completed</span>`:`<span class="pill prog">${progressOf(r)} / ${REQ_COUNT}</span>`}</td><td style="white-space:nowrap">${r.updatedAt?new Date(r.updatedAt).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—"}</td></tr>`).join("")}
   </tbody></table></div>
   ${resBiz==="__all"&&bizs.length>1?`<p class="help" style="margin-top:14px">Pick a business above to compare its founders side by side.</p>`:""}
   ${compareHTML(people)}`}`;
  $("#bizSel").onchange=e=>{resBiz=e.target.value;drawResults()};
  const src=rows.length?rows:allRuns;
  if($("#csv")) $("#csv").onclick=()=>saveFile(`brand-journey-responses-${new Date().toISOString().slice(0,10)}.csv`,toDelim(src,","));
  if($("#tsv")) $("#tsv").onclick=()=>copyText(toDelim(src,"\t"));
}
function compareHTML(people){
  if(!people.length) return "";
  const ans=(p,v)=>`<div class="ans"><b style="color:${p.c}">${esc(p.r.name||"—")}</b><div>${has(v)?esc(v):'<span class="empty">—</span>'}</div></div>`;
  let part=0;
  return `<div class="cmp"><div class="legend-p">${people.map(p=>`<span><i style="background:${p.c}"></i>${esc(p.r.name||"—")}</span>`).join("")}</div>${SECTIONS.map((sec,si)=>{
    let body="";
    QPAGES.filter(p=>p.s===si+1).forEach(pg=>{
      if(pg.type==="sliders"){
        body+=`<div class="qblock"><h4>Dials</h4><div class="slcmp">${SLIDERS.map(([k,l,r])=>`<div><div class="slc-l"><span>${l}</span><span>${r}</span></div><div class="slc-track">${people.filter(p=>p.r.answers.sl).map(p=>`<span class="slc-dot" style="left:${100-p.r.answers.sl[k]}%;background:${p.c}" title="${esc(p.r.name)}">${esc(p.ini)}</span>`).join("")}</div></div>`).join("")}</div></div><div class="qblock"><h4>Dials, in their own words</h4>${people.map(p=>ans(p,p.r.answers.sl_note)).join("")}</div>`;
      } else if(pg.type==="tot"){
        body+=`<div class="qblock"><h4>Choices · shaded where people disagree</h4><div class="tbl-wrap"><table class="totcmp"><thead><tr><th>Round</th><th>This or that</th>${people.map(p=>`<th style="color:${p.c}">${esc(p.ini)}</th>`).join("")}</tr></thead><tbody>
        ${PAIRS.map(pr=>{const picks=people.map(p=>(p.r.answers.tot||{})[pr.id]);const diff=new Set(picks.filter(Boolean)).size>1;
          return `<tr><td>${ROUNDS[pr.r]}</td><td>${optsOf(pr).map(o=>esc(o[0])).join(" / ")}</td>${picks.map(x=>`<td class="${diff?"diff":""}">${x?esc(labelOf(pr,x)):"—"}</td>`).join("")}</tr>`}).join("")}</tbody></table></div></div>`;
      } else if(pg.type==="moodboard"){
        body+=`<div class="qblock"><h4>Moodboards</h4>${people.map(p=>{const ims=p.r.answers.mb_images||[];const n=p.r.answers.mb_notes;
          return `<div class="ans"><b style="color:${p.c}">${esc(p.r.name||"—")}</b><div>${ims.length?`<div class="thumbs sm">${ims.map(im=>`<figure><img src="${esc(im.url)}" alt="${esc(im.name||"")}" loading="lazy"></figure>`).join("")}</div>`:""}${has(n)?esc(n):(ims.length?"":'<span class="empty">—</span>')}</div></div>`}).join("")}</div>`;
      } else {
        outOf(pg,{}).forEach(([q],qi)=>{ body+=`<div class="qblock"><h4>${esc(q)}</h4>${people.map(p=>ans(p,outOf(pg,p.r.answers)[qi][1])).join("")}</div>`; });
      }
    });
    let ph=""; if(sec.p!==part){part=sec.p;ph=`<div class="part-h">Part ${part} · ${PART_NAMES[part]}</div>`}
    return `${ph}<section><h2>${esc(sec.n)}</h2>${body}</section>`;
  }).join("")}</div>`;
}
function toDelim(rows,sep){
  const cols=["Name","Business","Role","Mode","Status","Updated"];
  fmt({}).forEach(g=>g.items.forEach(([q])=>cols.push(`${SECTIONS[g.s-1].n}: ${q}`)));
  cols.push("Moodboard image links");
  SLIDERS.forEach(([k,l,r])=>cols.push(`Dial: ${l} (0) to ${r} (100)`));
  PAIRS.forEach(p=>cols.push(`This or That: ${optsOf(p).map(o=>o[0]).join(" / ")}`));
  const cell=v=>{v=String(v??"");if(sep==="\t")return v.replace(/[\t\n\r]+/g," ");return /[",\n\r]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const base=location.origin;
  const lines=[cols.map(cell).join(sep)];
  rows.forEach(r=>{const a=r.answers||{};const row=[r.name,r.business,r.role,r.mode==="team"?"Team":"Solo",r.completedAt?"Completed":`${progressOf(r)}/${REQ_COUNT}`,r.updatedAt||""];
    fmt(a).forEach(g=>g.items.forEach(([,,v])=>row.push(v||"")));
    row.push((a.mb_images||[]).map(im=>/^https?:/.test(im.url)?im.url:base+im.url).join(" "));
    SLIDERS.forEach(([k])=>row.push(a.sl&&a.sl[k]!=null?100-a.sl[k]:""));
    PAIRS.forEach(p=>row.push(a.tot&&a.tot[p.id]?labelOf(p,a.tot[p.id]):""));
    lines.push(row.map(cell).join(sep))});
  return lines.join("\n");
}
let beforeResults=0;
$("#resBtn").onclick=()=>{
  if(PAGES[page].type==="results"){page=beforeResults;$("#resBtn").textContent="Responses";render();return}
  beforeResults=page; if(!PAGES.some(p=>p.type==="results")) PAGES.push({id:"results",type:"results"}); page=pageIdx("results"); $("#resBtn").textContent="Back to journey"; render();
};

/* ---------- boot ---------- */
page=0; render();
(async()=>{
  const c=C();
  const [d,u,as]=c?await Promise.all([c.use("db"),c.use("user"),c.use("assets")]).catch(()=>[null,null,null]):[null,null,null];
  db=d; assets=as; if(u){ try{me=await u.id()}catch(e){} try{isOwner=await u.isOwner()}catch(e){} }
  if(isOwner) $("#resBtn").hidden=false;
  if(db&&me){
    try{ const s=await db.doc("responses/"+me).get(); if(s.exists){ myDoc={runs:{...((s.data()||{}).runs||{})}} } online=true; }
    catch(e){ online=false }
  } else online=!!SHEET_URL;
  if(["welcome","moodboard"].includes(PAGES[page].type)) render();
})();
})();
</script>

</body>
</html>
